# Production-shaped stack: Postgres, Redis, the API, a Celery worker, beat,
# and Nginx in front.
#
# Worker and beat run the same image as the web container. One image means one
# build, one set of dependencies, and no possibility of a task importing code
# that only exists in the web image.

name: fashion-trendz

x-django-env: &django-env
  DJANGO_SETTINGS_MODULE: config.settings
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
  DEBUG: ${DEBUG:-False}
  ENVIRONMENT: ${ENVIRONMENT:-production}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
  # Set DATABASE_URL to point the stack at managed PostgreSQL (Neon, Supabase,
  # RDS). Left blank, the bundled postgres service below is used instead.
  DATABASE_URL: ${DATABASE_URL:-}
  DB_NAME: ${DB_NAME:-fashion_trendz}
  DB_USER: ${DB_USER:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
  DB_HOST: postgres
  DB_PORT: 5432
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  EMAIL_HOST: ${EMAIL_HOST:-}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
  RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
  RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: fashion-trendz-api:latest
  environment: *django-env
  volumes:
    - media:/app/media
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-fashion_trendz}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      # pg_isready, not a port check: the port opens before Postgres finishes
      # recovery, and the API would connect and immediately fail.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-fashion_trendz}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    # Append-only persistence. The cache is disposable, but Redis is also the
    # Celery broker here, and losing the broker loses queued notifications.
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    <<: *app
    command: ["gunicorn", "--config", "gunicorn.conf.py"]
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/ready/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    <<: *app
    # Never migrates — see docker/entrypoint.sh. Only the web container does.
    command:
      ["celery", "-A", "config", "worker", "--loglevel=info", "--concurrency=4"]
    healthcheck:
      test: ["CMD", "celery", "-A", "config", "inspect", "ping", "-d", "celery@$$HOSTNAME"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  beat:
    <<: *app
    # Exactly one replica, always. Two beats means every scheduled job fires
    # twice — including the ones that email customers.
    # The schedule lives in config/celery.py, so the default file-backed
    # scheduler is enough. django-celery-beat would add a dependency, an app
    # and a migration purely to make the schedule editable in the admin, which
    # nobody has asked for.
    command: ["celery", "-A", "config", "beat", "--loglevel=info"]
    deploy:
      replicas: 1

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/var/www/media:ro
      - static:/var/www/static:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres:
  redis:
  media:
  static:
