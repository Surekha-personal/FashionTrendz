version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.14
    commands:
      - python --version
      - pip --version
      - pip install --upgrade pip
      - pip install -r requirements.txt

  pre_build:
    commands:
      - python manage.py check

  build:
    commands:
      - python manage.py test
      - python manage.py makemigrations --check --dry-run
      - python manage.py spectacular --validate

  post_build:
    commands:
      - echo "FashionTrendz backend build completed successfully"
