name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  # A new push supersedes the run in progress for the same branch.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test-only values. Nothing real is needed: the suite never reaches a
  # payment gateway or an SMTP server.
  SECRET_KEY: ci-only-not-a-real-secret
  DEBUG: "False"
  ENVIRONMENT: ci
  ALLOWED_HOSTS: localhost,127.0.0.1,testserver
  DB_NAME: fashion_trendz
  DB_USER: postgres
  DB_PASSWORD: postgres
  DB_HOST: localhost
  DB_PORT: "5432"
  # Deliberately unset, so the suite exercises the inline path — the one a
  # developer runs locally.
  CELERY_BROKER_URL: ""
  EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
  SECURE_SSL_REDIRECT: "False"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: fashion_trendz
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system checks
        # --deploy surfaces the production security warnings that a plain
        # `check` stays quiet about.
        run: |
          python manage.py check
          python manage.py check --deploy --fail-level ERROR

      - name: Migration drift
        # Fails when a model changed without a migration — the single most
        # common broken deploy.
        run: python manage.py makemigrations --check --dry-run

      - name: Migrate
        run: python manage.py migrate --noinput

      - name: Tests
        run: python manage.py test --parallel 4 --shuffle

      - name: OpenAPI schema
        # --fail-on-warn is deliberately not used: the schema carries known,
        # harmless warnings about untyped path parameters on slug routes.
        run: python manage.py spectacular --file openapi.yaml --validate

      - uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: openapi.yaml

  build:
    runs-on: ubuntu-latest
    needs: test
    # Only build an image for something that will be deployed. Pull requests
    # get the test job and nothing more.
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: fashion-trendz-api:${{ github.sha }}
          # Layer cache in the Actions cache, so a dependency-only change does
          # not rebuild every wheel.
          cache-from: type=gha
          cache-to: type=gha,mode=max
