name: Backend CI/CD

on:
  push:
    branches:
      - Backend_fz
  workflow_dispatch:

jobs:

  ci:
    name: CI - Test Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: fashion_trendz
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django checks
        env:
          SECRET_KEY: ci-only-not-a-real-secret
          DEBUG: "False"
          ENVIRONMENT: ci
          ALLOWED_HOSTS: localhost,127.0.0.1,testserver
          DB_NAME: fashion_trendz
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: "5432"
          CELERY_BROKER_URL: ""
          EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
          SECURE_SSL_REDIRECT: "False"
        run: |
          python manage.py check
          python manage.py check --deploy --fail-level ERROR

      - name: Migration check
        env:
          SECRET_KEY: ci-only-not-a-real-secret
          DEBUG: "False"
          ENVIRONMENT: ci
          ALLOWED_HOSTS: localhost,127.0.0.1,testserver
          DB_NAME: fashion_trendz
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: "5432"
          CELERY_BROKER_URL: ""
          EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
          SECURE_SSL_REDIRECT: "False"
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Run migrations
        env:
          SECRET_KEY: ci-only-not-a-real-secret
          DEBUG: "False"
          ENVIRONMENT: ci
          ALLOWED_HOSTS: localhost,127.0.0.1,testserver
          DB_NAME: fashion_trendz
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: "5432"
          CELERY_BROKER_URL: ""
          EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
          SECURE_SSL_REDIRECT: "False"
        run: |
          python manage.py migrate --noinput

      - name: Run tests
        env:
          SECRET_KEY: ci-only-not-a-real-secret
          DEBUG: "False"
          ENVIRONMENT: ci
          ALLOWED_HOSTS: localhost,127.0.0.1,testserver
          DB_NAME: fashion_trendz
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: "5432"
          CELERY_BROKER_URL: ""
          EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
          SECURE_SSL_REDIRECT: "False"
        run: |
          python manage.py test --parallel 4 --shuffle

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t fashion-backend:new .
          docker save fashion-backend:new -o fashion-backend-image.tar

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-backend
          path: fashion-backend-image.tar

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image-backend
          path: ./

      - name: Copy Docker image to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "fashion-backend-image.tar"
          target: "/home/ubuntu/fashion-backend/"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            cd /home/ubuntu/fashion-backend/

            echo "Loading Docker image..."
            docker load -i fashion-backend-image.tar

            echo "Starting test container..."

            docker rm -f test-container-backend 2>/dev/null || true

            docker run -d \
              --name test-container-backend \
              -p 8001:8000 \
              -e SECRET_KEY="${{ secrets.DJANGO_SECRET_KEY }}" \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              fashion-backend:new

            echo "Waiting for application..."
            sleep 10

            echo "Checking application health..."

            if curl -f http://localhost:8001/ready/; then

              echo "Health check PASSED"

              docker rm -f test-container-backend

              if docker image inspect fashion-backend-prod:backup >/dev/null 2>&1; then
                docker rmi fashion-backend-prod:backup 2>/dev/null || true
              fi

              if docker ps -a --format '{{.Names}}' | grep -q "^fashion-backend-prod$"; then
                echo "Backing up current production image..."
                docker commit fashion-backend-prod fashion-backend-prod:backup
                docker rm -f fashion-backend-prod
              fi

              echo "Starting new production container..."

              docker run -d \
                --name fashion-backend-prod \
                --restart always \
                -p 8000:8000 \
                -e SECRET_KEY="${{ secrets.DJANGO_SECRET_KEY }}" \
                -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
                fashion-backend:new

              sleep 5

              echo "Checking production health..."

              if curl -f http://localhost:8000/ready/; then
                echo "================================="
                echo "DEPLOYMENT SUCCESSFUL"
                echo "================================="
              else
                echo "Production health check FAILED"
                echo "Rolling back..."

                docker rm -f fashion-backend-prod 2>/dev/null || true

                if docker image inspect fashion-backend-prod:backup >/dev/null 2>&1; then
                  docker run -d \
                    --name fashion-backend-prod \
                    --restart always \
                    -p 8000:8000 \
                    -e SECRET_KEY="${{ secrets.DJANGO_SECRET_KEY }}" \
                    -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
                    fashion-backend-prod:backup

                  echo "Rollback completed"
                else
                  echo "No backup image available!"
                  exit 1
                fi

                exit 1
              fi

            else

              echo "================================="
              echo "HEALTH CHECK FAILED"
              echo "DEPLOYMENT CANCELLED"
              echo "================================="

              docker logs test-container-backend --tail 50
              docker rm -f test-container-backend

              exit 1

            fi

            rm -f fashion-backend-image.tar

            echo "Running containers:"
            docker ps
