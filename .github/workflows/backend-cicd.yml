name: Backend CI/CD

on:
  push:
    branches:
      - Backend_fz
  workflow_dispatch:

jobs:

  # ============================================================
  # CI - TEST DJANGO BACKEND
  # ============================================================
  ci:
    name: CI - Test Backend
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: ci-only-not-a-real-secret
      DEBUG: "False"
      ENVIRONMENT: ci
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver

      # IMPORTANT:
      # Force CI to use the PostgreSQL service container.
      # This overrides DATABASE_URL from .env.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fashion_trendz?sslmode=disable
      CELERY_BROKER_URL: ""
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      SECURE_SSL_REDIRECT: "False"

    services:

      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: fashion_trendz
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:

      # ----------------------------------------------------------
      # CHECKOUT
      # ----------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # PYTHON
      # ----------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      # ----------------------------------------------------------
      # INSTALL DEPENDENCIES
      # ----------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ----------------------------------------------------------
      # DJANGO CHECKS
      # ----------------------------------------------------------
      - name: Django checks
        run: |
          python manage.py check
          python manage.py check --deploy --fail-level ERROR

      # ----------------------------------------------------------
      # MIGRATION CHECK
      # ----------------------------------------------------------
      - name: Migration check
        run: |
          python manage.py makemigrations --check --dry-run

      # ----------------------------------------------------------
      # RUN MIGRATIONS
      # ----------------------------------------------------------
      - name: Run migrations
        run: |
          python manage.py migrate --noinput

      # ----------------------------------------------------------
      # RESET TEST DATABASE
      # ----------------------------------------------------------
      - name: Reset test database
        run: |
          PGPASSWORD=postgres psql \
            -h localhost \
            -U postgres \
            -d postgres \
            -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = 'test_fashion_trendz' AND pid <> pg_backend_pid();"

          PGPASSWORD=postgres psql \
            -h localhost \
            -U postgres \
            -d postgres \
            -c "DROP DATABASE IF EXISTS test_fashion_trendz;"

      # ----------------------------------------------------------
      # RUN TESTS
      # ----------------------------------------------------------
      - name: Run tests
        run: |
          python manage.py test --shuffle


  # ============================================================
  # DOCKER BUILD
  # ============================================================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: ci

    steps:

      # ----------------------------------------------------------
      # CHECKOUT
      # ----------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # BUILD IMAGE
      # ----------------------------------------------------------
      - name: Build Docker image
        run: |
          docker build -t fashion-backend:new .

      # ----------------------------------------------------------
      # SAVE IMAGE
      # ----------------------------------------------------------
      - name: Save Docker image
        run: |
          docker save fashion-backend:new -o fashion-backend-image.tar

      # ----------------------------------------------------------
      # UPLOAD ARTIFACT
      # ----------------------------------------------------------
      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-backend
          path: fashion-backend-image.tar


  # ============================================================
  # DEPLOY TO EC2
  # ============================================================
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: docker

    steps:

      # ----------------------------------------------------------
      # DOWNLOAD IMAGE
      # ----------------------------------------------------------
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image-backend
          path: ./

      # ----------------------------------------------------------
      # COPY IMAGE TO EC2
      # ----------------------------------------------------------
      - name: Copy Docker image to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "fashion-backend-image.tar"
          target: "/home/ubuntu/fashion-backend/"

      # ----------------------------------------------------------
      # DEPLOY
      # ----------------------------------------------------------
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            set -e

            cd /home/ubuntu/fashion-backend/

            echo "================================="
            echo "Loading Docker image..."
            echo "================================="

            docker load -i fashion-backend-image.tar


            # ====================================================
            # TEST NEW CONTAINER
            # ====================================================

            echo "================================="
            echo "Starting test container..."
            echo "================================="

            docker rm -f test-container-backend 2>/dev/null || true

            docker run -d \
              --name test-container-backend \
              -p 8001:8000 \
              -e SECRET_KEY="${{ secrets.DJANGO_SECRET_KEY }}" \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              fashion-backend:new

            echo "Waiting for application..."

            sleep 10


            # ====================================================
            # TEST HEALTH CHECK
            # ====================================================

            echo "================================="
            echo "Checking application health..."
            echo "================================="

            if curl -f http://localhost:8001/ready/; then

              echo "================================="
              echo "HEALTH CHECK PASSED"
              echo "================================="

              docker rm -f test-container-backend


              # ==================================================
              # REMOVE OLD BACKUP
              # ==================================================

              if docker image inspect fashion-backend-prod:backup >/dev/null 2>&1; then

                echo "Removing old backup image..."

                docker rmi fashion-backend-prod:backup 2>/dev/null || true

              fi


              # ==================================================
              # BACKUP CURRENT PRODUCTION
              # ==================================================

              if docker ps -a --format '{{.Names}}' | grep -q "^fashion-backend-prod$"; then

                echo "================================="
                echo "Backing up current production..."
                echo "================================="

                docker commit \
                  fashion-backend-prod \
                  fashion-backend-prod:backup

                docker rm -f fashion-backend-prod

              fi


              # ==================================================
              # START NEW PRODUCTION
              # ==================================================

              echo "================================="
              echo "Starting new production container..."
              echo "================================="

              docker run -d \
                --name fashion-backend-prod \
                --restart always \
                -p 8000:8000 \
                -e SECRET_KEY="${{ secrets.DJANGO_SECRET_KEY }}" \
                -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
                fashion-backend:new

              sleep 5


              # ==================================================
              # PRODUCTION HEALTH CHECK
              # ==================================================

              echo "================================="
              echo "Checking production health..."
              echo "================================="

              if curl -f http://localhost:8000/ready/; then

                echo "================================="
                echo "DEPLOYMENT SUCCESSFUL"
                echo "================================="

              else

                echo "================================="
                echo "PRODUCTION HEALTH CHECK FAILED"
                echo "ROLLING BACK..."
                echo "================================="

                docker rm -f fashion-backend-prod 2>/dev/null || true


                if docker image inspect fashion-backend-prod:backup >/dev/null 2>&1; then

                  docker run -d \
                    --name fashion-backend-prod \
                    --restart always \
                    -p 8000:8000 \
                    -e SECRET_KEY="${{ secrets.DJANGO_SECRET_KEY }}" \
                    -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
                    fashion-backend-prod:backup

                  echo "================================="
                  echo "ROLLBACK COMPLETED"
                  echo "================================="

                else

                  echo "================================="
                  echo "NO BACKUP IMAGE AVAILABLE"
                  echo "================================="

                  exit 1

                fi

                exit 1

              fi

            else

              echo "================================="
              echo "HEALTH CHECK FAILED"
              echo "DEPLOYMENT CANCELLED"
              echo "================================="

              docker logs test-container-backend --tail 50

              docker rm -f test-container-backend

              exit 1

            fi


            # ====================================================
            # CLEANUP
            # ====================================================

            rm -f fashion-backend-image.tar

            echo "================================="
            echo "Running containers:"
            echo "================================="

            docker ps
