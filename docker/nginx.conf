# Nginx in front of Gunicorn.
#
# Three jobs: terminate slow clients so a worker is never held open by one,
# serve media and static from disk so Python never sees those requests, and
# rate-limit the endpoints worth attacking before they reach the application.

upstream api {
    server web:8000;
    # Reuse upstream connections instead of a fresh TCP handshake per request.
    keepalive 32;
}

# ---------------------------------------------------------------------------
# Rate limiting
# ---------------------------------------------------------------------------
# A second layer under DRF's throttles, not a replacement. This one stops
# traffic before it costs a worker and a database connection; DRF's is
# per-user and knows what the request means. Both are needed.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=2r/s;

limit_conn_zone $binary_remote_addr zone=conn:10m;

# Real client IP, for the throttles and the logs. Only trusted because the
# proxy is inside the compose network; do not extend this to arbitrary hops.
map $http_x_forwarded_for $client_ip {
    default $remote_addr;
}

server {
    listen 80;
    server_name _;

    # Product images are the largest thing this API accepts.
    client_max_body_size 10M;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # Never advertise the version.
    server_tokens off;

    # Baseline headers. Django sets its own on responses it generates; these
    # cover the static and media responses Django never sees.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain application/xml;

    limit_conn conn 20;

    # -----------------------------------------------------------------------
    # Static and media
    # -----------------------------------------------------------------------
    # Served from disk. A catalogue page requests dozens of images; routing
    # those through Gunicorn would occupy every worker serving bytes.
    location /static/ {
        alias /var/www/static/;
        # Filenames are content-hashed by the manifest storage, so a year is
        # safe: a changed file is a different URL.
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias /var/www/media/;
        # Not hashed — a re-uploaded product image keeps its name — so a
        # shorter window, still long enough to matter.
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # -----------------------------------------------------------------------
    # Probes
    # -----------------------------------------------------------------------
    # Unlimited and unlogged. A rate-limited health check eventually returns
    # 429 and takes the instance out of rotation for being healthy.
    location ~ ^/(health|ready)/$ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        access_log off;
    }

    # -----------------------------------------------------------------------
    # Credential endpoints
    # -----------------------------------------------------------------------
    # Tighter limit: these are the ones worth brute-forcing.
    location ~ ^/api/v1/auth/(login|register|password) {
        limit_req zone=auth burst=5 nodelay;

        proxy_pass http://api;
        include /etc/nginx/conf.d/proxy_headers.conf;
    }

    # -----------------------------------------------------------------------
    # Everything else
    # -----------------------------------------------------------------------
    location / {
        limit_req zone=api burst=40 nodelay;

        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Longer than Gunicorn's own 60s timeout, so a slow request is killed
        # by the application — which logs what it was doing — rather than by
        # the proxy, which does not.
        proxy_connect_timeout 10s;
        proxy_send_timeout 70s;
        proxy_read_timeout 70s;

        # Buffer responses so a slow client drains from Nginx, not from a
        # Gunicorn worker. This is the single most valuable line in the file.
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 32k;
    }
}
